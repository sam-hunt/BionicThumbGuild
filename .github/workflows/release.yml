name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check translations
        run: python3 Scripts/check-translations.py --strict

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build BionicThumbGuild.sln -c Release

      - name: Stage mod files
        run: dotnet build Source/1.6/BionicThumbGuild.csproj -c Release -t:StageMod -p:StageDir=${{ github.workspace }}/release/BionicThumbGuild

      - name: Package mod
        run: |
          cd release
          zip -r ../BionicThumbGuild-${GITHUB_REF_NAME}.zip BionicThumbGuild

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: BionicThumbGuild-${{ github.ref_name }}.zip
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, '-rc') }}
